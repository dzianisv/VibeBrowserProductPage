# LFS BUDGET GUARD — read before adding `lfs: true` to any checkout below.
#
# This repo stores ~180 MB of marketing demo videos in Git LFS (17 objects;
# `public/linkedin-demo.mp4` alone is 71 MB). GitHub's free plan allows
# 1 GB/month of LFS *bandwidth*, and that quota is consumed per-job, not
# per-push. With 6 CI jobs at `lfs: true`, ONE push burns the entire monthly
# budget (~1.08 GB) and every subsequent `actions/checkout` on every branch
# hard-fails with:
#   batch response: This repository exceeded its LFS budget
#
# None of the jobs in this file decode, serve, or assert on video bytes:
#   - lint/typecheck/audit jobs read source only;
#   - `next build` merely COPIES public/, so LFS pointer files are harmless;
#   - the Puppeteer E2E specs (test-install-nonce.cjs, test-pricing-responsive.cjs)
#     assert on DOM, cookies, layout overflow and pricing copy — never on a
#     <video> element's playback state.
# Therefore every checkout here is pinned to `lfs: false`.
#
# Only set `lfs: true` where a job genuinely needs the real video bytes. As of
# the fix for #203 that is NOWHERE — the deploy jobs in deploy.yml and
# deploy-opencode-mobile-site.yml also use `lfs: false`, because:
#   - vibebrowser.app never serves local video (`.vercelignore` drops
#     `public/*.mp4|webm`, and next.config.mjs 307s those requests to
#     dl.agentlabs.cc); and
#   - agentlabs.cc / opencode.agentlabs.cc, which DO serve their own bytes,
#     fetch those four files from dl.agentlabs.cc at build time via
#     `scripts/media-assets.cjs fetch <app>`. That host is a Cloudflare Worker
#     in front of this repo's `media-v1` GitHub Release; release-asset egress is
#     unmetered, unlike Git LFS bandwidth. See #207.
#
# Because package.json's `"prebuild": "git lfs pull 2>/dev/null || true"`
# silently tolerates missing LFS content, every deploy job runs
# `scripts/media-assets.cjs verify <app>` after its build. That guard fails the
# deploy if any .mp4/.webm in the output is an LFS pointer or implausibly small,
# so a future misconfiguration errors loudly instead of shipping broken video.
name: Website CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: website-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  root-site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # See LFS BUDGET GUARD at top of file: no job here reads video bytes.
          lfs: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      # The `lib/__tests__/*.test.ts` unit suite. This step is NOT optional
      # bookkeeping: `npm test` existed in package.json but was wired into no
      # job, so `lib/__tests__/referral-tracking.test.ts` had been passing
      # locally and running NOWHERE in CI. Every check on a PR could go green
      # while that suite was red — the same false-green class of failure as
      # VibeTechnologies/VibeWebAgent#1846. Any new `lib/__tests__/*.test.ts`
      # file is picked up automatically by the glob, so keep unit tests there.
      # Node's built-in runner strips the TypeScript, so no extra toolchain.
      - run: npm test
      # Source-string regression guard for the pricing value-clarity copy
      # (per-tier cloud-AI usage caps, reset wording, CWS trust link, and the
      # no-numeric-rating / no-aggregateRating guarantees). Reads source only,
      # so it doesn't need the build.
      - run: node scripts/test-pricing-value-clarity.js
      # Guards the title-keyed product dispatch in shared/company-profile/config.ts:
      # renaming a product title without updating its `product.title === "..."`
      # branch silently breaks the agentlabs.cc absolute-href rewrite. Source only.
      - run: node scripts/test-company-profile-title-dispatch.cjs
      - run: npm run build
      # Regression guard for the shared /og/[key] image route
      # (app/og/[key]/route.tsx + lib/og-image-designs.tsx) introduced by the
      # Vercel-function-budget consolidation. Statically verifies every
      # /og/<key> reference under app/ and shared/ resolves to a real design
      # key (catches typos/removed keys), then spawns `next start` and
      # verifies every real key serves a valid 1200x630 PNG while
      # prototype-chain keys (`constructor`, `toString`, `__proto__`, ...)
      # and unknown keys get a clean, non-year-cached 404 instead of a 500 or
      # a meaningless 200. Only needs Node's built-in fetch, no browser.
      - run: node scripts/test-og-image-routing.cjs

  agentlabs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # See LFS BUDGET GUARD at top of file: no job here reads video bytes.
          lfs: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            apps/agentlabs/package-lock.json
      - run: npm ci
      - run: npm ci --prefix apps/agentlabs
      - run: npm audit --omit=dev --audit-level=high --prefix apps/agentlabs
      - run: npm run lint --prefix apps/agentlabs
      - run: npm run build --prefix apps/agentlabs

  install-nonce-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # See LFS BUDGET GUARD at top of file: no job here reads video bytes.
          lfs: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # Ensure Puppeteer's bundled Chromium is present in the CI cache dir.
      - run: npx puppeteer browsers install chrome
      - run: npm run build
      # Real-browser E2E for the /install gtag.js -> nonce handoff (issue #1546):
      # spawns `next start` against the production build, drives real Chromium via
      # Puppeteer, loads the site's real gtag.js, and asserts the cold-start
      # client_id -> nonce flow + same-origin protection. Exits non-zero on any
      # failed assertion, which fails this required check. The only mocked boundary
      # is PR #1551's relay, stood up locally via ANALYTICS_API_BASE inside the script.
      - run: node scripts/test-install-nonce.cjs

  opencode-mobile-site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # See LFS BUDGET GUARD at top of file: no job here reads video bytes.
          lfs: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: OpenCodeMobileSite/package-lock.json
      - run: npm ci --prefix OpenCodeMobileSite
      - run: npm audit --omit=dev --audit-level=high --prefix OpenCodeMobileSite
      - run: npm run lint --prefix OpenCodeMobileSite
      - run: npm run build --prefix OpenCodeMobileSite

  pricing-responsive-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # See LFS BUDGET GUARD at top of file: no job here reads video bytes.
          lfs: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # Ensure Puppeteer's bundled Chromium is present in the CI cache dir.
      - run: npx puppeteer browsers install chrome
      - run: npm run build
      # Real-browser rendered/responsive check for the /pricing route: spawns
      # `next start` against the production build and drives real Chromium via
      # Puppeteer at three viewports (mobile 375, tablet 768, desktop 1440),
      # asserting no horizontal overflow plus that the three per-tier cloud-AI
      # usage-cap lines, the CWS trust link, and the reset-wording footnote are
      # present, not hidden, and scrollable into view. Exits non-zero on any
      # failed assertion, which fails this required check.
      - run: node scripts/test-pricing-responsive.cjs

  vercel-function-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # See LFS BUDGET GUARD at top of file: no job here reads video bytes.
          lfs: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # Guard against the Vercel Hobby-plan 12-Serverless-Function limit
      # regressing (a `next` bump once broke opengraph-image/twitter-image
      # metadata-route dedup, ballooning real functions 5 -> 21 and hard-failing
      # every prod deploy). Builds the production deployment and counts the real
      # (non-symlink) *.func bundles. On PRs without VERCEL_TOKEN it SKIPs the
      # network build cleanly, but the deterministic self-test of the counting
      # logic always runs. Exits non-zero if the real count exceeds 12.
      - run: node scripts/check-vercel-function-budget.cjs
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  no-lfs-reintroduction:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          lfs: false
      # Demo video moved out of Git LFS to GitHub Release assets (tag media-v1)
      # served via dl.agentlabs.cc. The 24 orphaned LFS objects (211 MB) can
      # never be reclaimed by GitHub without deleting the repo, so LFS must not
      # come back without a deliberate review decision. This check fails on any
      # `filter=lfs` .gitattributes entry, any committed LFS pointer, or any
      # tracked blob over 5 MB.
      - run: ./scripts/check-no-lfs.sh
