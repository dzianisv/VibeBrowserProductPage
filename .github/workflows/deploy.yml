name: Deploy to Cloudflare

# Production deploy of https://www.vibebrowser.app (plus the apex,
# enterprise, teams, status and incognito hostnames, all attached to the
# same Worker as custom domains).
#
# The site is a Next.js app with real server features (proxy.ts host
# routing, API routes, dynamic /status.json), so it ships as a Cloudflare
# Worker built with the OpenNext adapter (@opennextjs/cloudflare) — see
# wrangler.jsonc and docs/deploy.md. Vercel was retired for this site on
# 2026-11-26 (its Hobby tier paused the commercial deployment with
# HTTP 402 DEPLOYMENT_DISABLED).
#
# Secrets of record (GitHub Actions repo secrets):
#   CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID — wrangler deploy auth.
#     The token value is backed up in Bitwarden Secrets Manager
#     (shared_infra project, CLOUDFLARE_API_TOKEN).
#   INDEXNOW_KEY — IndexNow ping after deploy.
#   The Worker's own runtime secrets (BREVO_API_KEY, WAITLIST_SNAPSHOT_TOKEN)
#   are set on the Worker itself via `wrangler secret put`, NOT here.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'OpenCodeMobileSite/**'
  workflow_dispatch:

# Serialize production deploys: two pushes in quick succession must not race
# (the second would upload while the first is mid-deploy). Queue, don't cancel.
concurrency:
  group: deploy-cloudflare-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # LFS BUDGET GUARD (see ci.yml): the deploy never reads video bytes —
          # root-site media is fetched from the release CDN in the step below,
          # and this site serves no repo-tracked video.
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # sharp is an optionalDependency of next. Its native .node binaries
      # cannot be bundled by the OpenNext/esbuild step ("No loader is
      # configured for .node files") and fail the build. Next runs fine
      # without it, and on Cloudflare the IMAGES binding (wrangler.jsonc)
      # performs the image optimization instead.
      - name: Remove sharp (unbundleable native module)
        run: rm -rf node_modules/sharp node_modules/@img

      # Root-site media (demo videos, og video poster) is served from the
      # public CDN repo, not from git — fetch it into public/ before building
      # so the pages' same-origin /videos/... URLs resolve. Same step the
      # Vercel workflow ran. Fail-loud if the release is missing.
      - name: Fetch root-site media assets
        run: node scripts/media-assets.cjs fetch root

      # The blog repository falls back to a build-time bundled copy of
      # blog/*.md on runtimes without a filesystem (Workers). Regenerate it
      # so a post merged in this push ships in this deploy.
      - name: Generate bundled blog content
        run: node scripts/generate-blog-content.mjs

      - name: Build (OpenNext → Cloudflare Worker)
        run: npx opennextjs-cloudflare build

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Post-deploy smoke test: fail the run (and surface it) if production is
      # not actually serving the marketing homepage after the deploy.
      - name: Smoke test production homepage
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS https://www.vibebrowser.app/ | grep -qi 'Vibe'; then
              echo "Production homepage OK"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "Production homepage did not serve expected content"
          exit 1

      # Notify IndexNow (Bing/Yandex/etc.) that the sitemap changed.
      # Non-fatal: indexing notification must never fail a deploy.
      - name: Ping IndexNow
        continue-on-error: true
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          if [ -z "$INDEXNOW_KEY" ]; then echo "INDEXNOW_KEY not set, skipping"; exit 0; fi
          curl -sS -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"www.vibebrowser.app\",\"key\":\"$INDEXNOW_KEY\",\"keyLocation\":\"https://www.vibebrowser.app/$INDEXNOW_KEY.txt\",\"urlList\":[\"https://www.vibebrowser.app/sitemap.xml\"]}" \
            -w "\nIndexNow HTTP %{http_code}\n" || true
