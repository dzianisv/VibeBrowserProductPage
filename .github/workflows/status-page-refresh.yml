name: Status Page Refresh

# Regenerates public/status.json from data/status-endpoints.json -- a
# verbatim mirror of the deterministic probes the VibeWebAgent oncall
# health-sweep cron (oncall-health-sweep.yml) actually executes on every run
# (db_probe/api_health_readiness, relay_health, docs_portal -- see
# scripts/generate-status.mjs header here for the full sync contract) --
# and commits it so the next Vercel deploy (triggered by this push) serves
# fresh data at https://vibebrowser.app/status. This is the "publish" half of
# AGE-1095; status-page-freshness-check.yml is the "assert it isn't stale"
# half.
#
# The commit below deliberately does NOT use "[skip ci]": this repo's normal
# Vercel-on-push deploy is what actually publishes the refreshed status.json
# to https://vibebrowser.app/status.json. Skipping CI here would commit the
# fresh snapshot to git but never ship it, so the public page would keep
# serving the previous snapshot until an unrelated deploy happened to pick
# it up -- exactly the "reports green from stale data" failure this issue
# exists to prevent.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

concurrency:
  group: status-page-refresh
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate status.json
        run: node scripts/generate-status.mjs

      - name: Commit status.json if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- public/status.json; then
            echo "No change in status.json — skipping commit."
            exit 0
          fi
          git config user.name "vibe-status-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/status.json
          git commit -m "chore(status): refresh public status snapshot"
          git push
