# Daily snapshot of the waitlist size, committed back to main so growth is chartable.
#
# Brevo is the only store for the waitlist and its per-contact `createdAt` is
# unusable for history (the 402 contacts migrated on 2026-08-05 all carry that
# migration date). The only way to get a real time series is to sample the list
# size once a day going forward, which is what this job does.
#
# LFS BUDGET GUARD — see the same note at the top of ci.yml. This repo burned its
# entire LFS bandwidth quota on `actions/checkout` pulling ~180 MB of demo video
# per job. This job reads a Brevo count and writes a CSV; it never touches video
# bytes, so the checkout is pinned to `lfs: false`. scripts/check-no-lfs.sh
# enforces that LFS stays out of the repo.
name: Waitlist Snapshot

on:
  schedule:
    # 06:15 UTC daily. Off the hour on purpose: GitHub's scheduler queues heavily
    # at :00 and can drop runs entirely under load.
    - cron: '15 6 * * *'
  workflow_dispatch:

concurrency:
  group: waitlist-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Needed to push the updated CSV back to main.
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          # See LFS BUDGET GUARD above: this job never reads video bytes.
          lfs: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      # `npm ci` would install the whole Next.js toolchain to run one fetch().
      # The script's only non-builtin dependency is dotenv, which is a no-op in
      # CI anyway (no .env file), so install just that.
      - run: npm install --no-save --no-audit --no-fund dotenv

      # WHY NOT CALL BREVO DIRECTLY: Brevo pins API keys to an IP allowlist and
      # GitHub-hosted runners get a new egress IP every run (401 "unrecognised IP
      # address", run 31679376529). We read the live count through the deployed,
      # token-authenticated production route instead, whose Vercel egress Brevo
      # already trusts. The Brevo key never reaches this runner.
      - name: Verify snapshot credentials are present
        env:
          WAITLIST_COUNT_URL: ${{ secrets.WAITLIST_COUNT_URL }}
          WAITLIST_SNAPSHOT_TOKEN: ${{ secrets.WAITLIST_SNAPSHOT_TOKEN }}
        run: |
          set -euo pipefail
          # Fail closed and loudly: a missing secret must never degrade into a
          # skipped snapshot or a stale/mocked number.
          : "${WAITLIST_COUNT_URL:?WAITLIST_COUNT_URL secret is not set}"
          : "${WAITLIST_SNAPSHOT_TOKEN:?WAITLIST_SNAPSHOT_TOKEN secret is not set}"
          case "$WAITLIST_COUNT_URL" in
            https://*) ;;
            *) echo "WAITLIST_COUNT_URL must be https://"; exit 1 ;;
          esac

      - name: Snapshot waitlist count via production endpoint
        env:
          WAITLIST_COUNT_URL: ${{ secrets.WAITLIST_COUNT_URL }}
          WAITLIST_SNAPSHOT_TOKEN: ${{ secrets.WAITLIST_SNAPSHOT_TOKEN }}
        run: node scripts/snapshot-waitlist-count.js

      - name: Commit updated snapshot
        run: |
          set -euo pipefail
          # Scope the add to exactly one path. `git add -A` at the repo root is
          # forbidden here: .agents/backups/ holds a gitignored CSV of real user
          # emails and must never be staged, even by accident.
          git add data/waitlist-count.csv
          if git diff --cached --quiet; then
            echo "No change in waitlist count today; nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(waitlist): daily count snapshot [skip ci]"
          git push origin HEAD:main

      # DEAD-CRON GUARD for the hourly mailto reconciler (AGE-61).
      #
      # The reconciler is the only thing standing between a mailto-fallback
      # signup and the bin. If its schedule silently stops firing — GitHub
      # disables cron on inactive repos, a bad edit can unregister the workflow,
      # a stuck run can wedge the concurrency group — nothing else would notice,
      # and we would be back to losing signups with no symptom. This job already
      # runs daily, so it is the cheapest place to assert the reconciler is alive.
      #
      # Deliberately checks "a run COMPLETED in the last 24h", not "a run exists":
      # a workflow that only ever ran once, when a human dispatched it, is dead.
      - name: Assert the mailto reconciler is still running
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/waitlist-mailto-reconcile.yml/runs?event=schedule&status=completed&per_page=1" \
            --jq '.workflow_runs[0].updated_at // ""')
          if [ -z "$latest" ]; then
            echo "::error::No COMPLETED SCHEDULED run of waitlist-mailto-reconcile.yml exists. The hourly cron is not firing — mailto waitlist signups are being lost again (AGE-61)."
            exit 1
          fi
          age=$(( ( $(date -u +%s) - $(date -u -d "$latest" +%s) ) / 3600 ))
          echo "Last scheduled reconciler run: $latest (${age}h ago)."
          if [ "$age" -gt 24 ]; then
            echo "::error::waitlist-mailto-reconcile has not completed a scheduled run in ${age}h (expected hourly). Mailto waitlist signups may be piling up unsynced — see AGE-61."
            exit 1
          fi
